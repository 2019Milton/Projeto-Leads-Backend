name: Segurança Webhook LinkedIn

on:
  push:
    branches:
      - fix/linkedin-webhook-failclosed-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar assinatura e fail-closed
        run: node --test linkedin-webhook-security.test.mjs

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Testar todos os módulos
        run: bun test
