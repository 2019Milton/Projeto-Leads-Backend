name: Segurança Webhook LinkedIn

on:
  push:
    branches:
      - fix/linkedin-webhook-failclosed-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar assinatura e fail-closed (sem dependências)
        run: node --test linkedin-webhook-security.test.mjs
